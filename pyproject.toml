[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bepsy-oscillator-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

